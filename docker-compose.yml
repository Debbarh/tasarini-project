version: '3.9'

x-backend-env: &backend-env
  - ./backend/.env

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasarini
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d tasarini -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build:
      context: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py check_ai_providers &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    env_file: *backend-env
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_LIBRETRANSLATE_URL=http://localhost:5050
    depends_on:
      - backend

  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    ports:
      - '5050:5000'
    environment:
      - LT_LOAD_ONLY=en,fr,es,de,it,pt,ru,ja,zh,hi,ar
      - LT_THREADS=4
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/languages || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
